[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cmip-downloader"
dynamic = ["version"]
description = "A lightweight and fast downloader for regional subsets of CMIP3, CMIP5, CMIP6 and CMIP7 data, from the cloud mirrors and ESGF."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hari" }]
keywords = ["cmip", "cmip5", "cmip6", "cmip7", "esgf", "climate", "ocean", "xarray", "zarr", "pangeo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Oceanography",
]
dependencies = [
    "xarray>=2025.1",
    "zarr>=2.18",
    "dask",
    "fsspec",
    "gcsfs",
    "intake-esgf",
    "netCDF4",
    "cftime",
    "pandas>=2",
    "numpy",
]

[project.optional-dependencies]
esgf = []  # kept so the 0.2.0 install command still works; ESGF support is now built in
aws = ["s3fs"]
all = ["s3fs"]
dev = ["pytest", "ruff"]

[project.urls]
Repository = "https://github.com/luffy-178/CMIP-Downloader"

[project.scripts]
cmip-download = "cmip_downloader.cli:main"

[tool.hatch.version]
path = "src/cmip_downloader/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cmip_downloader"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
